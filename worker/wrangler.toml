# 台詞小精靈 解析 Worker（SPEC 第 6 節）
# 站長設定：確認 ALLOWED_ORIGIN，並把 MODEL 的 REPLACE_ME 換成實際值，再 `npx wrangler deploy`。
# API key 不放這裡：在終端機執行 `npx wrangler secret put OPENROUTER_API_KEY` 貼上（不經過聊天、不寫進任何檔案）。
name = "tsj-parse"
main = "src/index.mjs"
compatibility_date = "2025-01-01"
workers_dev = true

[vars]
# CORS 只允許這個來源（只填來源，不含路徑）。換自訂網域時只改這裡與前端的 TSJ_CONFIG.WORKER_URL。
ALLOWED_ORIGIN = "https://cjlcv6061-svg.github.io"
# OpenRouter 模型 ID。上線前到 openrouter.ai 的模型頁確認現行 ID（SPEC：DeepSeek V4.1 Flash）。
MODEL = "anthropic/claude-haiku-5.5"
# 供應商允許清單（逗號分隔）。到模型頁的 Providers 分頁確認它們標示為不訓練、不保留提示詞；更換時須重新確認。
PROVIDERS = "anthropic"
# 每個 IP 每日請求數上限／全站每日總請求數上限（UTC 日）。
DAILY_PER_IP = "100"
DAILY_TOTAL = "600"
# 本機開發時設為 "true" 才允許 http://localhost 來源；正式環境保持 "false"。
ALLOW_LOCALHOST = "false"

# 限流計數器：Durable Object（SQLite 版，免費方案可用；計數是原子的）
[[durable_objects.bindings]]
name = "LIMITER"
class_name = "Limiter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Limiter"]
